# The Bank Desk's replay mode as a static site on GitHub Pages (scripts/export_pages.py): built from main on every
# push. The desk needs no τ², no GPU and no keys, so the build installs only what the desk app imports. Deploying
# needs a public repo with Pages set to "GitHub Actions"; while the repo is private the deploy job is skipped.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the desk's dependencies
        run: pip install "fastapi==0.162.0" "pydantic>=2" httpx
      - name: Export the replay site
        env:
          PYTHONPATH: src
          GLINT_HOME: ${{ runner.temp }}/home
        run: python scripts/export_pages.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
