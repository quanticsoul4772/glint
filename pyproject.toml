[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glint"
version = "0.0.1"
description = "Deterministic policy gates and decision tools for Meta's open-weight Muse Glimmer 30B: every write is checked before it runs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "tau2[knowledge]",
    "litellm>=1.80.15,<1.82.7",
    "modal",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "python-dotenv",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.uv.sources]
# Pinned τ²-bench v1.0.1 (commit fc0055dc4e0a316c3f83133267fbd6faaa770992), cloned outside this repo.
tau2 = { path = "../vendor/tau2-bench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/glint"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# tmp_path folders on D: in the repo (gitignored), not the system temp on C:; pytest clears it at each run
addopts = "--basetemp=.pytest_tmp"

[tool.coverage.run]
branch = true  # every if/else arm counts, not only lines (gate: scripts/coverage_gate.py)
# the library and the measurement pipeline; the finished one-off pilot and check scripts are left out
source = ["src/glint", "scripts"]
omit = [
    "scripts/banking_glimmer.py", "scripts/build_jobs.py", "scripts/cost_check.py", "scripts/dryrun_m0.py",
    "scripts/gate_prompts.py", "scripts/headroom_pilot.py", "scripts/label_shipped.py", "scripts/m1_*.py",
    "scripts/m2_*.py", "scripts/mock_meta_server.py", "scripts/partition.py", "scripts/planb_k16.py",
    "scripts/serve_smoke.py", "scripts/twin_pilot.py", "scripts/unedited_rerun.py", "scripts/usersim_check.py",
    # code that only runs on Modal: the GPU capture functions, and the desk's deploy wrapper (checked by deploy-desk)
    "src/glint/glimmer_modal.py", "src/glint/desk/modal_app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85  # the total goal; per-module floors are in scripts/coverage_gate.py
exclude_also = ["if __name__ == .__main__.:"]  # entry points; their main() is tested
