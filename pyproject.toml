[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glint"
version = "0.0.1"
description = "Activation-gated agent harness on Meta's open-weight Muse Glimmer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "tau2",
    "litellm>=1.80.15,<1.82.7",
    "modal",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "python-dotenv",
    "kaggle>=2.2.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv.sources]
# Pinned τ²-bench v1.0.1 (commit fc0055dc4e0a316c3f83133267fbd6faaa770992), cloned outside this repo.
tau2 = { path = "../vendor/tau2-bench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/glint"]

[tool.ruff]
line-length = 110
